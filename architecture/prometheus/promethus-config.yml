global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s


scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ "prometheus:9090" ]

  - job_name: fileservice
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'fileservice:8080' ]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [ 'minio:9000' ]

  - job_name: basket
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'basket:8080' ]
  
  - job_name: goodscategory
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'goodscategory:8080' ]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: [ 'keycloak:8080' ]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: [ 'grafana:3000' ]

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: [ 'alloy:9080' ]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: [ 'loki:3100' ]

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: [ 'tempo:3200' ]
  
  - job_name: keycloak-postgres
    static_configs:
      - targets: [ 'keycloak-postgres-exporter:9187' ]

  - job_name: goods-categories-postgres-exporter
    static_configs:
      - targets: [ 'goods-categories-postgres-exporter:9188' ]

  - job_name: basket-db-postgres-exporter
    static_configs:
      - targets: [ 'basket-db-postgres-exporter:9189' ]
  