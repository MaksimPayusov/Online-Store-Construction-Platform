spring:
  application:
    name: file-service
  
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

server:
  port: ${SERVER_PORT:8082}

minio:
  endpoint: ${MINIO_ENDPOINT:minio-storage}
  port: ${MINIO_PORT:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:admin1234}
  bucket-name: ${MINIO_BUCKET_NAME:fashionconstruct}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  secure: ${MINIO_SECURE:false}

file:
  max-size: ${FILE_MAX_SIZE:10485760}
  allowed-extensions: ${FILE_ALLOWED_EXTENSIONS:.jpg,.jpeg,.png,.gif,.webp,.svg,.pdf,.doc,.docx}

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.example.fileservice: ${LOG_LEVEL:INFO}
    io.minio: ${LOG_LEVEL:INFO}
