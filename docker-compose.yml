services:
  #бд для кеширования
  redis:
    image: redis
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - microservices

  #бд для кейклоака
  keycloak_postgres:
    image: postgres:15
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - keycloak_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 20

  #экспортер для бд кейклоака
  keycloak-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: keycloak-postgres-exporter
    depends_on:
      person-postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://keycloak:keycloak@keycloak-postgres:5432/keycloak?sslmode=disable
    ports:
      - "9189:9187"

  #для кейклоака и экспорта конфига
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    command: start-dev --import-realm --metrics-enabled=true
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: -Dkeycloak.migration.usersExportStrategy=REALM_FILE
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_FEATURES: account  
    volumes:
      - ./architecture/keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json
    depends_on:
      keycloak_postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL","curl -fsS http://localhost:9000/healthy/ready || exit 1" ]  
      interval: 10s
      timeout: 5s
      retries: 50
    networks:
      - keycloak_net

  #krakenD
  krakend:
    image: devopsfaith/krakend:2.1.2
    container_name: krakend
    ports:
      - "8081:8080"
    expose:
      - 8081
    volumes:
      - ./architecture/krakend:/etc/krakend
    networks:
      - keycloak_net
      - microservices

  #бд для категорий товаров
  goods-categories:
    image: postgres:15
    container_name: goods-categories
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_goods-categories_data:/var/lib/postgresql/data
    networks:
      - microservices
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 20

  #экспортер для бд категорий товаров
  goods-categories-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: goods-categories-postgres-exporter
    depends_on:
      person-postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://keycloak:keycloak@keycloak-postgres:5432/keycloak?sslmode=disable
    ports:
      - "9189:9188"

  #микросервис для категорий товаров
  goodscategory:
    build:
      context: ./goodscategory
      dockerfile: Dockerfile
    container_name: goodscategory
    ports:
      - "8005:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
    depends_on:
      goods_categories:
        condition: service_healthy
    networks:
      - microservices

  #бд для корзины
  basket-db:
    image: postgres:15
    container_name: basket-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_basket_data:/var/lib/postgresql/data
    networks:
      - microservices
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 20

  #экспортер для бд корзины
  basket-db-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: basket-db-postgres-exporter
    depends_on:
      person-postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://keycloak:keycloak@keycloak-postgres:5432/keycloak?sslmode=disable
    ports:
      - "9189:9189"

  #микросервис корзины
  basket:
    build:
      context: ./basket
      dockerfile: Dockerfile
    container_name: basket
    ports:
      - "8006:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      basket_db:
        condition: service_healthy
    networks:
      - microservices

  #микросервис чтобы хранить файлы
  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin1234
      - MINIO_DEFAULT_BUCKETS=fashionconstuct
    command: server /data --console-address ":9001"
    networks:
      microservices:
        aliases:
          - minio-storage
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    restart: always

  
  #микросервис для обмена файлами
  fileservice:
    build:
      context: ./fileservice
      dockerfile: Dockerfile
    container_name: fileservice
    ports:
      - "8007:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - microservices
    

  #prometheus поменять конфиг
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./architecture/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - microservices

  #loki
  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./architecture/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3100/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - microservices

  #tempo
  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./architecture/tempo/tempo.yaml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
    - microservices

  #alloy change
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    user: root
    ports:
      - "9080:9080" # HTTP interface
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP http
    volumes:
      - ./architecture/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    environment:
      GRAFANA_LOKI_URL: http://loki:3100/loki/api/v1/push
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
    - microservices

  #grafana
  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
      alloy:
        condition: service_started
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_METRICS_ENABLED: "true"
    volumes:
      - ./architecture/grafana/provisioning:/etc/grafana/provisioning
      - ./architecture/grafana/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
  networks:
    - microservices



#волум
volumes:
  postgres_keycloak_data:
  postgres_goods-categories_data:
  redis_data:
  postgres_basket_data:
  minio_data:
  loki_data:
  loki_chunks:
  loki_index:
  loki_rules:
  tempo_data:

networks:
  #нетворк для кейклоака
  keycloak_net:
    driver: bridge
  #нетворк для микросервисов
  microservices:
    driver: bridge
  api_gateaway:
    driver: bridge




