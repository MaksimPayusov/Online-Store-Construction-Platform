services:
  #бд для кеширования
  redis:
    image: redis
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - microservices
  #бд для кейклоака
  keycloak_postgres:
    image: postgres:15
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - keycloak_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 20
  #для кейклоака и экспорта конфига
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    command: start-dev --import-realm --metrics-enabled=true
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: -Dkeycloak.migration.usersExportStrategy=REALM_FILE
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_FEATURES: account  # ← КЛЮЧЕВОЕ ИЗМЕНЕНИЕ
    volumes:
      - ./architecture/keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json
    depends_on:
      keycloak_postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL","curl -fsS http://localhost:9000/healthy/ready || exit 1" ]  # ← исправил опечатку: exit1 → exit 1
      interval: 10s
      timeout: 5s
      retries: 50
    networks:
      - keycloak_net

  #krakenD

  krakend:
    container_name: krakend_gate
    image: devopsfaith/krakend:2.1.2
    ports:
      - "8081:8080"
    expose:
      - 8081
    volumes:
      - ./architecture/krakend/krakend.json:/etc/krakend.json
    networks:
      - keycloak_net
  #микросервис1
  #микросервис2
  #микросервис3
  #микросервис4
  #микросервис5
  #микросервис6
  #микросервис7
  #микросервис8



volumes:
  postgres_keycloak_data:
  redis_data:

networks:
  #нетворк для кейклоака
  keycloak_net:
    driver: bridge
  microservices:
    driver: bridge
  api_gateaway:
